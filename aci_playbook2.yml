---
- name: Configure Cisco ACI Fabric Access Policies
  hosts: apic
  gather_facts: no
  connection: local

  vars_files:
    - aci_vars.yml

  tasks:
    # Interface Policy Definitions
    - name: Create CDP Interface Policy - Disabled
      cisco.aci.aci_interface_policy_cdp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ cdp_policy_disabled }}"
        admin_state: no
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create CDP Interface Policy - Enabled
      cisco.aci.aci_interface_policy_cdp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ cdp_policy_enabled }}"
        admin_state: yes
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create LLDP Interface Policy - Enabled
      cisco.aci.aci_interface_policy_lldp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ lldp_policy_enabled }}"
        receive_state: yes
        transmit_state: yes
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create LLDP Interface Policy - Disabled
      cisco.aci.aci_interface_policy_lldp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ lldp_policy_disabled }}"
        receive_state: no
        transmit_state: no
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Port Channel Policy - Mode Off
      cisco.aci.aci_interface_policy_port_channel:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ port_channel_mode_off }}"
        mode: "off"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Port Channel Policy - LACP Active
      cisco.aci.aci_interface_policy_port_channel:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ port_channel_lacp_active }}"
        mode: active
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Spanning Tree Interface Policy - BPDU Filter Enabled
      cisco.aci.aci_interface_policy_spanning_tree:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ stp_policy }}"
        bpdu_filter: yes
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Storm Control Interface Policy
      cisco.aci.aci_interface_policy_storm_control:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        storm_control_policy: "{{ storm_control_policy }}"
        storm_control_action: "{{ storm_control_action }}"
        all_types_configuration:
          rate_type: "{{ storm_control_rate_type }}"
          rate: "{{ storm_control_rate }}"
          burst_rate: "{{ storm_control_burst_rate }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Link Level Policy
      cisco.aci.aci_interface_policy_link_level:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ link_level_policy }}"
        speed: "{{ link_speed }}"
        auto_negotiation: "{{ auto_negotiation }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after interface policies
      pause:
        seconds: "{{ pause_after_policies }}"

    # VLAN Pool
    - name: Create VLAN Pool
      cisco.aci.aci_vlan_pool:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        pool: "{{ vlan_pool_name }}"
        pool_allocation_mode: "{{ vlan_pool_allocation }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Add VLAN Ranges to Pool
      cisco.aci.aci_vlan_pool_encap_block:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        pool: "{{ vlan_pool_name }}"
        pool_allocation_mode: "{{ vlan_pool_allocation }}"
        block_start: "{{ item.start }}"
        block_end: "{{ item.end }}"
        state: present
      loop: "{{ vlan_ranges }}"
      throttle: "{{ throttle_vlan_pool }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: vlan_result
      until: vlan_result is not failed

    - name: Pause after VLAN pool
      pause:
        seconds: "{{ pause_after_vlan_pool }}"

    # Physical Domain
    - name: Create Physical Domain
      cisco.aci.aci_domain:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind VLAN Pool to Physical Domain
      cisco.aci.aci_domain_to_vlan_pool:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        pool: "{{ vlan_pool_name }}"
        pool_allocation_mode: "{{ vlan_pool_allocation }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # AAEP
    - name: Create AAEP
      cisco.aci.aci_aep:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        aep: "{{ aaep_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind Physical Domain to AAEP
      cisco.aci.aci_aep_to_domain:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        aep: "{{ aaep_name }}"
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after domain configuration
      pause:
        seconds: "{{ pause_after_domain }}"

    # Interface Policy Groups - VPC
    - name: Create VPC Interface Policy Group
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ vpc_policy_group }}"
        lag_type: node
        aep: "{{ aaep_name }}"
        cdp_policy: "{{ cdp_policy_enabled }}"
        lldp_policy: "{{ lldp_policy_enabled }}"
        link_level_policy: "{{ link_level_policy }}"
        port_channel_policy: "{{ port_channel_policy_static }}"
        storm_control_interface_policy: "{{ storm_control_policy }}"
        stp_interface_policy: "{{ stp_policy }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Policy Groups - Leaf Access Port
    - name: Create Leaf Access Port Policy Group - Storage
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ storage_policy_group }}"
        lag_type: leaf
        aep: "{{ aaep_name }}"
        cdp_policy: "{{ cdp_policy_enabled }}"
        lldp_policy: "{{ lldp_policy_enabled }}"
        link_level_policy: "{{ link_level_policy }}"
        stp_interface_policy: "{{ stp_policy }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Policy Groups - Leaf Access Port (vp000 a-series)
    - name: Create Leaf Access Port Policy Groups - A series
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ item }}"
        lag_type: leaf
        aep: "{{ aaep_name }}"
        cdp_policy: "{{ cdp_policy_disabled }}"
        lldp_policy: "{{ lldp_policy_disabled }}"
        link_level_policy: "{{ link_level_policy }}"
        stp_interface_policy: "{{ stp_policy }}"
        state: present
      loop: "{{ leaf_policy_groups_a }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Policy Groups - Leaf Access Port (vp000 b-series)
    - name: Create Leaf Access Port Policy Groups - B series
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ item }}"
        lag_type: leaf
        aep: "{{ aaep_name }}"
        cdp_policy: "{{ cdp_policy_disabled }}"
        lldp_policy: "{{ lldp_policy_disabled }}"
        link_level_policy: "{{ link_level_policy }}"
        stp_interface_policy: "{{ stp_policy }}"
        state: present
      loop: "{{ leaf_policy_groups_b }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after policy groups
      pause:
        seconds: "{{ pause_after_policy_groups }}"

    # Interface Profiles
    - name: Create Leaf Interface Profile - L1101
      cisco.aci.aci_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1101 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Leaf Interface Profile - L1102
      cisco.aci.aci_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1102 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Leaf Interface Profile - L1101_1102
      cisco.aci.aci_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1101_1102 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Selectors for L1101_1102_IntProf
    - name: Create Interface Selector - Eth1_1 on L1101_1102
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1101_1102 }}"
        access_port_selector: Eth1_1
        leaf_port_blk: block1
        from_port: 1
        to_port: 1
        from_card: 1
        to_card: 1
        policy_group: "{{ vpc_policy_group }}"
        interface_type: vpc
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Selectors for L1101_IntProf
    - name: Create Interface Selectors for L1101
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1101 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: block1
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        from_card: 1
        to_card: 1
        policy_group: "{{ item.policy_group }}"
        state: present
      loop: "{{ l1101_interface_selectors }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Selectors for L1102_IntProf
    - name: Create Interface Selectors for L1102
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1102 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: block1
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        from_card: 1
        to_card: 1
        policy_group: "{{ item.policy_group }}"
        state: present
      loop: "{{ l1102_interface_selectors }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after interface selectors
      pause:
        seconds: "{{ pause_after_interface_selectors }}"

    # Switch Profiles
    - name: Create Leaf Switch Profile - L1101
      cisco.aci.aci_switch_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ switch_profile_l1101 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Leaf Switch Profile - L1102
      cisco.aci.aci_switch_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ switch_profile_l1102 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Leaf Switch Profile - L1101_1102
      cisco.aci.aci_switch_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ switch_profile_l1101_1102 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Leaf Selectors
    - name: Create Leaf Selector - L1101
      cisco.aci.aci_switch_leaf_selector:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ switch_profile_l1101 }}"
        leaf: "{{ leaf_selector_l1101 }}"
        leaf_node_blk: block1
        from: "{{ leaf_1101 }}"
        to: "{{ leaf_1101 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind Interface Profile to L1101 Switch Profile
      cisco.aci.aci_interface_selector_to_switch_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ switch_profile_l1101 }}"
        interface_selector: "{{ interface_profile_l1101 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Leaf Selector - L1102
      cisco.aci.aci_switch_leaf_selector:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ switch_profile_l1102 }}"
        leaf: "{{ leaf_selector_l1102 }}"
        leaf_node_blk: block1
        from: "{{ leaf_1102 }}"
        to: "{{ leaf_1102 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind Interface Profile to L1102 Switch Profile
      cisco.aci.aci_interface_selector_to_switch_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ switch_profile_l1102 }}"
        interface_selector: "{{ interface_profile_l1102 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Leaf Selector - L1101_L1102
      cisco.aci.aci_switch_leaf_selector:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ switch_profile_l1101_1102 }}"
        leaf: "{{ leaf_selector_l1101_1102 }}"
        leaf_node_blk: block1
        from: "{{ leaf_1101 }}"
        to: "{{ leaf_1102 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind Interface Profile to L1101_1102 Switch Profile
      cisco.aci.aci_interface_selector_to_switch_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ switch_profile_l1101_1102 }}"
        interface_selector: "{{ interface_profile_l1101_1102 }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after switch profiles
      pause:
        seconds: "{{ pause_after_switch_profiles }}"

    # Tenant Configuration
    - name: Create Tenant
      cisco.aci.aci_tenant:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # VRF
    - name: Create VRF
      cisco.aci.aci_vrf:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        vrf: "{{ vrf_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Bridge Domains
    - name: Create Bridge Domains with Unicast Routing disabled
      cisco.aci.aci_bd:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        bd: "{{ item }}"
        vrf: "{{ vrf_name }}"
        enable_routing: no
        state: present
      loop: "{{ bridge_domains_no_routing }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Bridge Domains with default routing
      cisco.aci.aci_bd:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        bd: "{{ item }}"
        vrf: "{{ vrf_name }}"
        state: present
      loop: "{{ bridge_domains_with_routing }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after bridge domains
      pause:
        seconds: "{{ pause_after_bridge_domains }}"

    # Application Profile
    - name: Create Application Profile
      cisco.aci.aci_ap:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # EPGs without Intra-EPG Isolation
    - name: Create EPG - VLAN 22
      cisco.aci.aci_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ epg_vlan22 }}"
        bd: "{{ bd_vlan20 }}"
