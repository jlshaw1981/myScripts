---

- name: Configure Cisco ACI Fabric Access Policies
  hosts: apic
  gather_facts: no
  connection: local

  vars_files:
    - aci_vars_v9.yml

  tasks:
    # NTP Configuration
    - name: Create NTP Policy
      cisco.aci.aci_fabric_scheduler:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ ntp_policy_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Configure Date and Time Policy (NTP)
      cisco.aci.aci_rest:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        method: post
        path: /api/node/mo/uni/fabric/time-{{ ntp_policy_name }}.json
        content:
          datetimePol:
            attributes:
              name: "{{ ntp_policy_name }}"
              adminSt: "{{ ntp_admin_state }}"
              serverState: "{{ ntp_server_state }}"
              authSt: "{{ ntp_auth_state }}"
              status: created,modified
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Add NTP Server Provider
      cisco.aci.aci_rest:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        method: post
        path: /api/node/mo/uni/fabric/time-{{ ntp_policy_name }}.json
        content:
          datetimePol:
            attributes:
              name: "{{ ntp_policy_name }}"
            children:
              - datetimeNtpProv:
                  attributes:
                    name: "{{ ntp_server_ip }}"
                    preferred: "no"
                    minPoll: "4"
                    maxPoll: "6"
                    status: created,modified
                  children:
                    - datetimeRsNtpProvToEpg:
                        attributes:
                          tDn: "uni/tn-mgmt/mgmtp-default/oob-{{ ntp_mgmt_epg }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed
    
    # # Register fabric nodes (leafs and spines)
    # - name: Register fabric nodes
    #   cisco.aci.aci_fabric_node:
    #     host: "{{ ansible_host }}"
    #     username: "{{ aci_username }}"
    #     password: "{{ ansible_password }}"
    #     use_ssl: yes
    #     validate_certs: "{{ validate_certs }}"
    #     pod_id: "{{ item.pod_id }}"
    #     node_id: "{{ item.node_id }}"
    #     serial: "{{ item.serial }}"
    #     name: "{{ item.name }}"
    #     role: "{{ item.role }}"
    #     description: "Registered via Ansible"
    #     state: present
    #   loop: "{{ fabric_nodes }}"
    #   retries: "{{ retry_count }}"
    #   delay: "{{ retry_delay }}"
    #   register: result
    #   until: result is not failed

    - name: Create Pod Policy Group
      cisco.aci.aci_rest:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        method: post
        path: /api/node/mo/uni/fabric/funcprof/podpgrp-{{ pod_policy_group_name }}.json
        content:
          fabricPodPGrp:
            attributes:
              name: "{{ pod_policy_group_name }}"
              status: created,modified
            children:
              - fabricRsTimePol:
                  attributes:
                    tnDatetimePolName: "{{ ntp_policy_name }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after NTP configuration
      pause:
        seconds: "{{ pause_after_ntp }}"
       
    - name: Enable MCP policy
      cisco.aci.aci_interface_policy_mcp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        mcp: "{{ mcp_policy_name }}"
        admin_state: "{{ mcp_admin_state }}"
        mcp_mode: "{{ mode }}"
        state: present
    
    # Interface Policy Definitions
    - name: Create CDP Interface Policy - Disabled
      cisco.aci.aci_interface_policy_cdp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ cdp_policy_disabled }}"
        admin_state: no
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create CDP Interface Policy - Enabled
      cisco.aci.aci_interface_policy_cdp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ cdp_policy_enabled }}"
        admin_state: yes
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create LLDP Interface Policy - Enabled
      cisco.aci.aci_interface_policy_lldp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ lldp_policy_enabled }}"
        receive_state: yes
        transmit_state: yes
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create LLDP Interface Policy - Disabled
      cisco.aci.aci_interface_policy_lldp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ lldp_policy_disabled }}"
        receive_state: no
        transmit_state: no
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Port Channel Policy - Mode Off
      cisco.aci.aci_interface_policy_port_channel:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ port_channel_mode_off }}"
        mode: "off"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Port Channel Policy - LACP Active
      cisco.aci.aci_interface_policy_port_channel:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ port_channel_lacp_active }}"
        mode: "active"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Port Channel Policy - Static On
      cisco.aci.aci_interface_policy_port_channel:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ port_channel_static_on }}"
        mode: "off"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Configure VPC Protection Groups for Leaf Switches 1101 - 1102
      cisco.aci.aci_switch_policy_vpc_protection_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        protection_group: "{{ protection_group_name_L1101_L1102 }}"
        protection_group_id: "{{ protection_group_id_L1101_L1102 }}"
        vpc_domain_policy: "{{ vpc_domain_policy_L1101_L1102 }}"
        switch_1_id: "{{ switch_1_id }}"
        switch_2_id: "{{ switch_2_id }}"
        #switch_3_id: "{{ switch_3 }}"
        #switch_4_id: "{{ switch_4 }}"
        #switch_9_id: "{{ switch_9 }}"
        #switch_10_id: "{{ switch_10 }}"
        state: present
      delegate_to: localhost
    
    # Commented out because ACI simulator only has 2 leafs (1101 - 1102)
    # - name: Configure VPC Protection Groups for Leaf Switches 1103 - 1104
    #   cisco.aci.aci_switch_policy_vpc_protection_group:
    #     host: "{{ ansible_host }}"
    #     username: "{{ aci_username }}"
    #     password: "{{ ansible_password }}"
    #     validate_certs: "{{ validate_certs }}"
    #     protection_group: "{{ protection_group_name_L1103_L1104 }}"
    #     protection_group_id: "{{ protection_group_id_L1103_L1104 }}"
    #     vpc_domain_policy: "{{ vpc_domain_policy_L1103_L1104 }}"
    #     switch_3_id: "{{ switch_3_id }}"
    #     switch_4_id: "{{ switch_4_id }}"
    #     #switch_9_id: "{{ switch_9 }}"
    #     #switch_10_id: "{{ switch_10 }}"
    #     state: present
    #   delegate_to: localhost

    # Commented out because ACI simulator only has 2 leafs (1101 - 1102)
    # - name: Configure VPC Protection Groups for Leaf Switches 1109 - 1110
    #   cisco.aci.aci_switch_policy_vpc_protection_group:
    #     host: "{{ ansible_host }}"
    #     username: "{{ aci_username }}"
    #     password: "{{ ansible_password }}"
    #     validate_certs: "{{ validate_certs }}"
    #     protection_group: "{{ protection_group_name_L1109_L1110 }}"
    #     protection_group_id: "{{ protection_group_id_L1109_L1110 }}"
    #     vpc_domain_policy: "{{ vpc_domain_policy_L1109_L1110 }}"
    #     switch_9_id: "{{ switch_9_id }}"
    #     switch_10_id: "{{ switch_10_id }}"
    #     state: present
    #   delegate_to: localhost

    - name: Create Spanning Tree Interface Policy - BPDU Filter Enabled
      cisco.aci.aci_interface_policy_spanning_tree:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ stp_policy }}"
        bpdu_filter: yes
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Storm Control Interface Policy
      cisco.aci.aci_interface_policy_storm_control:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        storm_control_policy: "{{ storm_control_policy }}"
        storm_control_action: "{{ storm_control_action }}"
        all_types_configuration:
          rate: "{{ storm_control_rate }}"
          burst_rate: "{{ storm_control_burst_rate }}"
          rate_type: "{{ storm_control_rate_type }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Link Level Interface Policy - 25G Auto
      cisco.aci.aci_interface_policy_link_level:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        link_level_policy: "{{ link_level_policy }}"
        speed: "{{ link_speed }}"
        auto_negotiation: "{{ auto_negotiation }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after policies
      pause:
        seconds: "{{ pause_after_policies }}"

    # VLAN Pool Configuration
    - name: Create VLAN Pool
      cisco.aci.aci_vlan_pool:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        pool: "{{ vlan_pool_name }}"
        pool_allocation_mode: "{{ vlan_pool_allocation }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Add VLAN ranges to VLAN pool
      cisco.aci.aci_vlan_pool_encap_block:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        pool: "{{ vlan_pool_name }}"
        pool_allocation_mode: "{{ vlan_pool_allocation }}"
        block_start: "{{ item.start }}"
        block_end: "{{ item.end }}"
        state: present
      loop: "{{ vlan_ranges }}"
      throttle: "{{ throttle_vlan_pool }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after VLAN pool
      pause:
        seconds: "{{ pause_after_vlan_pool }}"

    # Physical Domain and AAEP
    - name: Create Physical Domain
      cisco.aci.aci_domain:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind VLAN Pool to Physical Domain
      cisco.aci.aci_domain_to_vlan_pool:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        pool: "{{ vlan_pool_name }}"
        pool_allocation_mode: "{{ vlan_pool_allocation }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Attachable Access Entity Profile (AAEP)
      cisco.aci.aci_aep:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        aep: "{{ aaep_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind Physical Domain to AAEP
      cisco.aci.aci_aep_to_domain:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        aep: "{{ aaep_name }}"
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after domain
      pause:
        seconds: "{{ pause_after_domain }}"

    # VPC Interface Policy Groups
    - name: Create Data VPC Interface Policy Groups
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ item }}"
        lag_type: "{{ type_1 }}"
        link_level_policy: "{{ link_level_policy }}"
        cdp_policy: "{{ cdp_policy_enabled }}"
        lldp_policy: "{{ lldp_policy_enabled }}"
        port_channel_policy: "{{ port_channel_static_on }}"
        stp_interface_policy: "{{ stp_policy }}"
        storm_control_interface_policy: "{{ storm_control_policy }}"
        aep: "{{ aaep_name }}"
        state: present
      loop: "{{ vpc_policy_group }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Storage VPC Interface Policy Groups
    - name: Create Storage VPC Interface Policy Groups
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ item }}"
        lag_type: "{{ type_2 }}"
        link_level_policy: "{{ link_level_policy }}"
        cdp_policy: "{{ cdp_policy_disabled }}"
        lldp_policy: "{{ lldp_policy_disabled }}"
        #port_channel_policy: "{{ port_channel_static_on }}"
        stp_interface_policy: "{{ stp_policy }}"
        storm_control_interface_policy: "{{ storm_control_policy }}"
        aep: "{{ aaep_name }}"
        state: present
      loop: "{{ storage_policy_group }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed
  
    # Leaf Access Port Policy Groups - A Series
    - name: Create Leaf Access Port Policy Groups - A Series
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ item }}"
        lag_type: "{{ type_2 }}"
        link_level_policy: "{{ link_level_policy }}"
        cdp_policy: "{{ cdp_policy_enabled }}"
        lldp_policy: "{{ lldp_policy_enabled }}"
        stp_interface_policy: "{{ stp_policy }}"
        storm_control_interface_policy: "{{ storm_control_policy }}"
        aep: "{{ aaep_name }}"
        state: present
      loop: "{{ leaf_policy_groups_a }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Leaf Access Port Policy Groups - B Series
    - name: Create Leaf Access Port Policy Groups - B Series
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ item }}"
        lag_type: "{{ type_2 }}"
        link_level_policy: "{{ link_level_policy }}"
        cdp_policy: "{{ cdp_policy_enabled }}"
        lldp_policy: "{{ lldp_policy_enabled }}"
        stp_interface_policy: "{{ stp_policy }}"
        storm_control_interface_policy: "{{ storm_control_policy }}"
        aep: "{{ aaep_name }}"
        state: present
      loop: "{{ leaf_policy_groups_b }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after policy groups
      pause:
        seconds: "{{ pause_after_policy_groups }}"

    # Interface Profiles
    - name: Create Interface Profiles
      cisco.aci.aci_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ item }}"
        state: present
      loop: "{{ interface_profiles }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed
   
    # Interface Selectors for L1101
    - name: Create Interface Selectors for L1101
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1101 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: "{{ item.name }}_blk"
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        policy_group: "{{ item.policy_group }}"
        state: present
      loop: "{{ l1101_interface_selectors }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Selectors for L1102
    - name: Create Interface Selectors for L1102
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1102 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: "{{ item.name }}_blk"
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        policy_group: "{{ item.policy_group }}"
        state: present
      loop: "{{ l1102_interface_selectors }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed
    
    # VPC Interface Selectors for L1101_L1102 (all *_data_apg interfaces configured as VPC)
    - name: Create VPC Interface Selectors on L1101_L1102 Profile
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1101_l1102 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: "{{ item.name }}_blk"
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        from_card: 1
        to_card: 1
        policy_group: "{{ item.policy_group }}"
        interface_type: "{{ interface_type_vpc }}"
        state: present
      loop: "{{ L1101_1102_vpc_interface_selectors }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Selectors for L1103
    - name: Create Interface Selectors for L1103
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1103 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: "{{ item.name }}_blk"
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        policy_group: "{{ item.policy_group }}"
        state: present
      loop: "{{ l1103_interface_selectors }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Selectors for L1104
    - name: Create Interface Selectors for L1104
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1104 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: "{{ item.name }}_blk"
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        policy_group: "{{ item.policy_group }}"
        state: present
      loop: "{{ l1104_interface_selectors }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed
    
    # VPC Interface Selectors for L1103_L1104 (all *_data_apg interfaces configured as VPC)
    - name: Create VPC Interface Selectors on L1103_L1104 Profile
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1103_l1104 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: "{{ item.name }}_blk"
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        from_card: 1
        to_card: 1
        policy_group: "{{ item.policy_group }}"
        interface_type: "{{ interface_type_vpc }}"
        state: present
      loop: "{{ L1103_L1104_vpc_interface_selectors }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed
       
    # VPC Interface Selectors for L1109_L1110 (all *_data_apg interfaces configured as VPC)
    - name: Create VPC Interface Selectors on L1109_L1110 Profile
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1109_l1110 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: "{{ item.name }}_blk"
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        from_card: 1
        to_card: 1
        policy_group: "{{ item.policy_group }}"
        interface_type: "{{ interface_type_vpc }}"
        state: present
      loop: "{{ L1109_L1110_vpc_interface_selectors }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed
    
    - name: Pause after interface selectors
      pause:
        seconds: "{{ pause_after_interface_selectors }}"

    # Switch Profiles
    - name: Create Switch Profiles
      cisco.aci.aci_switch_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ item.name }}"
        state: present
      loop: "{{ switch_profiles }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Add Leaf Selectors to Switch Profiles
      cisco.aci.aci_switch_leaf_selector:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ item.name }}"
        leaf: "{{ item.leaf_selector }}"
        leaf_node_blk: "{{ item.leaf_selector }}_block"
        from: "{{ item.node_from }}"
        to: "{{ item.node_to }}"
        state: present
      loop: "{{ switch_profiles }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind Interface Profiles to Switch Profiles
      cisco.aci.aci_interface_selector_to_switch_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ item.name }}"
        interface_selector: "{{ item.interface_profile }}"
        state: present
      loop: "{{ switch_profiles }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after switch profiles
      pause:
        seconds: "{{ pause_after_switch_profiles }}"

    # Tenant Configuration
    - name: Create Tenant
      cisco.aci.aci_tenant:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Ops VRF
      cisco.aci.aci_vrf:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        vrf: "{{ ops_vrf_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Admin VRF
      cisco.aci.aci_vrf:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        vrf: "{{ admin_vrf_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Application Profile
      cisco.aci.aci_ap:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Bridge Domains
    - name: Create Ops Bridge Domains - No Routing
      cisco.aci.aci_bd:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        bd: "{{ item }}"
        vrf: "{{ ops_vrf_name }}"
        enable_routing: no
        arp_flooding: yes
        l2_unknown_unicast: flood
        state: present
      loop: "{{ ops_bridge_domains_no_routing }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Admin Bridge Domains - No Routing
      cisco.aci.aci_bd:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        bd: "{{ item }}"
        vrf: "{{ admin_vrf_name }}"
        enable_routing: no
        arp_flooding: yes
        l2_unknown_unicast: flood
        state: present
      loop: "{{ admin_bridge_domains_no_routing }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Ops Bridge Domains - With Routing
      cisco.aci.aci_bd:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        bd: "{{ item }}"
        vrf: "{{ ops_vrf_name }}"
        enable_routing: yes
        arp_flooding: no
        l2_unknown_unicast: proxy
        state: present
      loop: "{{ ops_bridge_domains_with_routing }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Admin Bridge Domains - With Routing
      cisco.aci.aci_bd:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        bd: "{{ item }}"
        vrf: "{{ admin_vrf_name }}"
        enable_routing: yes
        arp_flooding: no
        l2_unknown_unicast: proxy
        state: present
      loop: "{{ admin_bridge_domains_with_routing }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after bridge domains
      pause:
        seconds: "{{ pause_after_bridge_domains }}"

    # EPG Configuration
    - name: Create Standard EPGs
      cisco.aci.aci_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ item.epg }}"
        bd: "{{ item.bd }}"
        state: present
      loop: "{{ epgs_standard }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Isolated EPGs
      cisco.aci.aci_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ item.epg }}"
        bd: "{{ item.bd }}"
        intra_epg_isolation: enforced
        state: present
      loop: "{{ epgs_isolated }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # EPGs for VLAN range 1400-2999 (SONS)
    - name: Create EPGs for VLAN range 1400-3827
      cisco.aci.aci_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "ops_vlan{{ item }}_epg"
        bd: "{{ sons_bridge_domain }}"
        state: present
      loop: "{{ range(vlan_range_start, vlan_range_end + 1) | list }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after EPGs
      pause:
        seconds: "{{ pause_after_epgs }}"

    # Create ESG
    - name: Create ESG for VLAN 20
      cisco.aci.aci_esg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        esg: "{{ esg_vlan20 }}"
        vrf: "{{ ops_vrf_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

     # Bind EPGs to ESG
    - name: Add EPGs to ESG
      cisco.aci.aci_esg_epg_selector:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        esg: "{{ esg_vlan20 }}"
        epg: "{{ item }}"
        epg_ap: "{{ app_profile }}"
        state: present
      loop: "{{ esg_vlan20_epgs }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Bind Physical Domain to Admin EPG ranges
    - name: Bind Physical Domain to Admin EPG ranges
      cisco.aci.aci_epg_to_domain:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "admin_vlan{{ item }}_epg"
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        state: present
      loop: "{{ admin_epg_vlan_ids }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Bind Physical Domain to EPG ranges (including 1400-2999)
    - name: Bind Physical Domain to Ops EPG ranges
      cisco.aci.aci_epg_to_domain:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "ops_vlan{{ item }}_epg"
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        state: present
      loop: "{{ ops_epg_vlan_ids }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Add Subnets to EPGs
    - name: Add Subnet to VLAN 31 EPG
      cisco.aci.aci_epg_subnet:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ epg_vlan31 }}"
        gateway: 192.168.12.1
        mask: 22
        scope: public
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Add Subnet to VLAN 51 EPG
      cisco.aci.aci_epg_subnet:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ epg_vlan51 }}"
        gateway: 192.168.112.1
        mask: 22
        scope: public
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Add Subnet to VLAN 60 EPG
      cisco.aci.aci_epg_subnet:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ epg_vlan60 }}"
        gateway: 192.168.254.1
        mask: 24
        scope: public
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed
  
    - name: Pause before static bindings
      pause:
        seconds: "{{ pause_before_static_bindings }}"

    - name: Expand Ops VLAN ranges
      set_fact:
        ops_vlans_expanded: >-
          {{ ops_vlans_expanded | default([]) + 
             (range(item.start, item.end + 1) | list) }}
      loop: "{{ ops_vlan_ranges }}"

    - name: Build Ops VLAN bindings list
      set_fact:
        ops_bindings: "{{ ops_bindings | default([]) + [{'epg': 'ops_vlan' ~ item ~ '_epg', 'vlan': item}] }}"
      loop: "{{ ops_vlans_expanded }}"

    - name: Expand Admin VLAN ranges
      set_fact:
        admin_vlans_expanded: >-
          {{ admin_vlans_expanded | default([]) + 
             (range(item.start, item.end + 1) | list) }}
      loop: "{{ admin_vlan_ranges }}"

    - name: Build Admin VLAN bindings list
      set_fact:
        admin_bindings: "{{ admin_bindings | default([]) + [{'epg': 'admin_vlan' ~ item ~ '_epg', 'vlan': item}] }}"
      loop: "{{ admin_vlans_expanded }}"

    - name: Combine all VPC static bindings
      set_fact:
        vpc_static_bindings: "{{ ops_bindings | default([]) + admin_bindings | default([]) }}"

    # Static Port Bindings - VPC
    # Bind all VPC interfaces for standard EPGs
    - name: Bind EPGs to all VPC interfaces
      cisco.aci.aci_static_binding_to_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ item.0.epg }}"
        interface_type: "{{ interface_type_vpc }}"
        pod_id: "{{ pod_id }}"
        leafs: "{{ leaf_pair }}"
        interface: "{{ item.1 }}"
        encap_id: "{{ item.0.vlan }}"
        deploy_immediacy: "{{ deploy_immediacy }}"
        mode: "{{ binding_mode_trunk }}"
        state: present
      loop: "{{ vpc_static_bindings | product(vpc_interfaces) | list }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed
    
    # Private VLAN Bindings
    - name: Bind Private VLAN EPGs to all VPC interfaces
      cisco.aci.aci_static_binding_to_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ item.0.epg }}"
        interface_type: "{{ interface_type_vpc }}"
        pod_id: "{{ pod_id }}"
        leafs: "{{ leaf_pair }}"
        interface: "{{ item.1 }}"
        encap_id: "{{ item.0.secondary_vlan }}"
        primary_encap_id: "{{ item.0.primary_vlan }}"
        deploy_immediacy: "{{ deploy_immediacy }}"
        mode: "{{ binding_mode_trunk }}"
        state: present
      loop: "{{ private_vlan_bindings | product(vpc_interfaces) | list }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

