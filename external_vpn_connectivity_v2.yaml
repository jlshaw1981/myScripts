nodes:
  - boot_disk_size: null
    configuration:
      - name: nxos_config.txt
        content: |-
          hostname L1103
          vdc L1103 id 1
            limit-resource vlan minimum 16 maximum 4094
            limit-resource vrf minimum 2 maximum 4096
            limit-resource port-channel minimum 0 maximum 511
            limit-resource u4route-mem minimum 248 maximum 248
            limit-resource u6route-mem minimum 96 maximum 96
            limit-resource m4route-mem minimum 58 maximum 58
            limit-resource m6route-mem minimum 8 maximum 8

          feature telnet
          feature scp-server
          feature interface-vlan

          no password strength-check
          username admin password cisco role network-admin
          username adminbackup password 5 ! role network-operator
          username adminbackup passphrase lifetime 99999 warntime 14 gracetime 3
          username cisco password cisco role network-admin
          username lab password 5 $1$buoy/oqy$.EXQz8rCn72ii8qtdldj00 role network-admin
          username lab passphrase lifetime 99999 warntime 14 gracetime 3
          no ip domain-lookup
          ip domain-name virl.info
          system default switchport
          no logging event trunk-status enable
          system jumbomtu 9216
          copp profile strict


          vlan dot1Q tag native

          vlan 1

          cdp enable
          vrf context management
           ip route 10.0.1.0/24 192.168.255.1
          hardware access-list tcam region racl 512
          hardware access-list tcam region arp-ether 256 double-wide
          hardware forwarding unicast trace


          interface vlan1
            shutdown
            no description
            no ip address

          interface Ethernet1/1 - 64
            no description
            no switchport
            shutdown

          interface mgmt0
           no shutdown
           description to mgmt
           duplex full
           no cdp
           vrf member management
           ip address 192.168.255.11 255.255.255.0

          interface loopback0
            description USED FOR BGP,LOGGING,OSPF,SSH,SNMP,TACACS+,MPLS,LISP
            ip address 172.17.1.11 255.255.255.255
            no shutdown

          line console
            exec-timeout 0
            terminal width 132
          line vty
            exec-timeout 0
            terminal width 132
          boot nxos bootflash:/nxos.9.3.6.bin sup-1

          logging console 7
          logging monitor 7
