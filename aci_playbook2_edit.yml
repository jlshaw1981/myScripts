---
- name: Configure Cisco ACI Fabric Access Policies
  hosts: apic
  gather_facts: no
  connection: local

  vars_files:
    - aci_vars_edit.yml

  tasks:
    # NTP Configuration
    - name: Create NTP Policy
      cisco.aci.aci_fabric_scheduler:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ ntp_policy_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Configure Date and Time Policy (NTP)
      cisco.aci.aci_rest:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        method: post
        path: /api/node/mo/uni/fabric/time-{{ ntp_policy_name }}.json
        content:
          datetimePol:
            attributes:
              name: "{{ ntp_policy_name }}"
              adminSt: "{{ ntp_admin_state }}"
              serverState: "{{ ntp_server_state }}"
              authSt: "{{ ntp_auth_state }}"
              status: created,modified
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Add NTP Server Provider
      cisco.aci.aci_rest:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        method: post
        path: /api/node/mo/uni/fabric/time-{{ ntp_policy_name }}.json
        content:
          datetimePol:
            attributes:
              name: "{{ ntp_policy_name }}"
            children:
              - datetimeNtpProv:
                  attributes:
                    name: "{{ ntp_server_ip }}"
                    preferred: "no"
                    minPoll: "4"
                    maxPoll: "6"
                    status: created,modified
                  children:
                    - datetimeRsNtpProvToEpg:
                        attributes:
                          tDn: "uni/tn-mgmt/mgmtp-default/oob-{{ ntp_mgmt_epg }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Pod Policy Group
      cisco.aci.aci_rest:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        method: post
        path: /api/node/mo/uni/fabric/funcprof/podpgrp-{{ pod_policy_group_name }}.json
        content:
          fabricPodPGrp:
            attributes:
              name: "{{ pod_policy_group_name }}"
              status: created,modified
            children:
              - fabricRsTimePol:
                  attributes:
                    tnDatetimePolName: "{{ ntp_policy_name }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after NTP configuration
      pause:
        seconds: "{{ pause_after_ntp }}"

    # Interface Policy Definitions
    - name: Create CDP Interface Policy - Disabled
      cisco.aci.aci_interface_policy_cdp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ cdp_policy_disabled }}"
        admin_state: no
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create CDP Interface Policy - Enabled
      cisco.aci.aci_interface_policy_cdp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ cdp_policy_enabled }}"
        admin_state: yes
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create LLDP Interface Policy - Enabled
      cisco.aci.aci_interface_policy_lldp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ lldp_policy_enabled }}"
        receive_state: yes
        transmit_state: yes
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create LLDP Interface Policy - Disabled
      cisco.aci.aci_interface_policy_lldp:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ lldp_policy_disabled }}"
        receive_state: no
        transmit_state: no
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Port Channel Policy - Mode Off
      cisco.aci.aci_interface_policy_port_channel:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ port_channel_mode_off }}"
        mode: "off"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Port Channel Policy - LACP Active
      cisco.aci.aci_interface_policy_port_channel:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ port_channel_lacp_active }}"
        mode: active
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Spanning Tree Interface Policy - BPDU Filter Enabled
      cisco.aci.aci_interface_policy_spanning_tree:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ stp_policy }}"
        bpdu_filter: yes
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Storm Control Interface Policy
      cisco.aci.aci_interface_policy_storm_control:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        storm_control_policy: "{{ storm_control_policy }}"
        storm_control_action: "{{ storm_control_action }}"
        all_types_configuration:
          rate_type: "{{ storm_control_rate_type }}"
          rate: "{{ storm_control_rate }}"
          burst_rate: "{{ storm_control_burst_rate }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Link Level Policy
      cisco.aci.aci_interface_policy_link_level:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        name: "{{ link_level_policy }}"
        speed: "{{ link_speed }}"
        auto_negotiation: "{{ auto_negotiation }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after interface policies
      pause:
        seconds: "{{ pause_after_policies }}"

    # VLAN Pool
    - name: Create VLAN Pool
      cisco.aci.aci_vlan_pool:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        pool: "{{ vlan_pool_name }}"
        pool_allocation_mode: "{{ vlan_pool_allocation }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Add VLAN Ranges to Pool
      cisco.aci.aci_vlan_pool_encap_block:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        pool: "{{ vlan_pool_name }}"
        pool_allocation_mode: "{{ vlan_pool_allocation }}"
        block_start: "{{ item.start }}"
        block_end: "{{ item.end }}"
        state: present
      loop: "{{ vlan_ranges }}"
      throttle: "{{ throttle_vlan_pool }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: vlan_result
      until: vlan_result is not failed

    - name: Pause after VLAN pool
      pause:
        seconds: "{{ pause_after_vlan_pool }}"

    # Physical Domain
    - name: Create Physical Domain
      cisco.aci.aci_domain:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind VLAN Pool to Physical Domain
      cisco.aci.aci_domain_to_vlan_pool:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        pool: "{{ vlan_pool_name }}"
        pool_allocation_mode: "{{ vlan_pool_allocation }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # AAEP
    - name: Create AAEP
      cisco.aci.aci_aep:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        aep: "{{ aaep_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind Physical Domain to AAEP
      cisco.aci.aci_aep_to_domain:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        aep: "{{ aaep_name }}"
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after domain
      pause:
        seconds: "{{ pause_after_domain }}"

    # VPC Interface Policy Group
    - name: Create VPC Interface Policy Group
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ vpc_policy_group }}"
        lag_type: node
        cdp_policy: "{{ cdp_policy_enabled }}"
        lldp_policy: "{{ lldp_policy_enabled }}"
        port_channel_policy: "{{ port_channel_lacp_active }}"
        stp_interface_policy: "{{ stp_policy }}"
        storm_control_interface_policy: "{{ storm_control_policy }}"
        link_level_policy: "{{ link_level_policy }}"
        aep: "{{ aaep_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Storage VPC Interface Policy Group
    - name: Create Storage VPC Interface Policy Group
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ storage_policy_group }}"
        lag_type: node
        cdp_policy: "{{ cdp_policy_disabled }}"
        lldp_policy: "{{ lldp_policy_disabled }}"
        port_channel_policy: "{{ port_channel_policy_static }}"
        stp_interface_policy: "{{ stp_policy }}"
        storm_control_interface_policy: "{{ storm_control_policy }}"
        link_level_policy: "{{ link_level_policy }}"
        aep: "{{ aaep_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Leaf Access Port Policy Groups - A Series
    - name: Create Leaf Access Port Policy Groups - A Series
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ item }}"
        lag_type: leaf
        cdp_policy: "{{ cdp_policy_enabled }}"
        lldp_policy: "{{ lldp_policy_enabled }}"
        stp_interface_policy: "{{ stp_policy }}"
        storm_control_interface_policy: "{{ storm_control_policy }}"
        link_level_policy: "{{ link_level_policy }}"
        aep: "{{ aaep_name }}"
        state: present
      loop: "{{ leaf_policy_groups_a }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Leaf Access Port Policy Groups - B Series
    - name: Create Leaf Access Port Policy Groups - B Series
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        policy_group: "{{ item }}"
        lag_type: leaf
        cdp_policy: "{{ cdp_policy_enabled }}"
        lldp_policy: "{{ lldp_policy_enabled }}"
        stp_interface_policy: "{{ stp_policy }}"
        storm_control_interface_policy: "{{ storm_control_policy }}"
        link_level_policy: "{{ link_level_policy }}"
        aep: "{{ aaep_name }}"
        state: present
      loop: "{{ leaf_policy_groups_b }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after policy groups
      pause:
        seconds: "{{ pause_after_policy_groups }}"

    # Interface Profiles
    - name: Create Interface Profiles
      cisco.aci.aci_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ item }}"
        state: present
      loop: "{{ interface_profiles }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Selectors for L1101
    - name: Create Interface Selectors for L1101
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1101 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: "{{ item.name }}_block"
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        policy_group: "{{ item.policy_group }}"
        state: present
      loop: "{{ l1101_interface_selectors }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Interface Selectors for L1102
    - name: Create Interface Selectors for L1102
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1102 }}"
        access_port_selector: "{{ item.name }}"
        leaf_port_blk: "{{ item.name }}_block"
        from_port: "{{ item.port }}"
        to_port: "{{ item.port }}"
        policy_group: "{{ item.policy_group }}"
        state: present
      loop: "{{ l1102_interface_selectors }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # VPC Interface Selectors for L1101_1102
    - name: Create VPC Interface Selector for L1101_1102
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_interface_profile: "{{ interface_profile_l1101_1102 }}"
        access_port_selector: Eth1_1
        leaf_port_blk: Eth1_1_block
        from_port: 1
        to_port: 1
        policy_group: "{{ vpc_policy_group }}"
        interface_type: vpc
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after interface selectors
      pause:
        seconds: "{{ pause_after_interface_selectors }}"

    # Switch Profiles
    - name: Create Switch Profiles
      cisco.aci.aci_switch_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ item.name }}"
        state: present
      loop: "{{ switch_profiles }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Add Leaf Selectors to Switch Profiles
      cisco.aci.aci_switch_leaf_selector:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ item.name }}"
        leaf: "{{ item.leaf_selector }}"
        leaf_node_blk: "{{ item.leaf_selector }}_block"
        from: "{{ item.node_from }}"
        to: "{{ item.node_to }}"
        state: present
      loop: "{{ switch_profiles }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind Interface Profiles to Switch Profiles
      cisco.aci.aci_interface_selector_to_switch_policy_leaf_profile:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        leaf_profile: "{{ item.name }}"
        interface_selector: "{{ item.interface_profile }}"
        state: present
      loop: "{{ switch_profiles }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after switch profiles
      pause:
        seconds: "{{ pause_after_switch_profiles }}"

    # Tenant Configuration
    - name: Create Tenant
      cisco.aci.aci_tenant:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create VRF
      cisco.aci.aci_vrf:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        vrf: "{{ vrf_name }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Create Application Profile
      cisco.aci.aci_ap:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Bridge Domains - No Routing
    - name: Create Bridge Domains without Routing
      cisco.aci.aci_bd:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        bd: "{{ item }}"
        vrf: "{{ vrf_name }}"
        enable_routing: no
        arp_flooding: yes
        l2_unknown_unicast: flood
        state: present
      loop: "{{ bridge_domains_no_routing }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Bridge Domains - With Routing
    - name: Create Bridge Domains with Default Routing
      cisco.aci.aci_bd:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        bd: "{{ item }}"
        vrf: "{{ vrf_name }}"
        enable_routing: yes
        arp_flooding: yes
        l2_unknown_unicast: flood
        state: present
      loop: "{{ bridge_domains_with_routing }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after bridge domains
      pause:
        seconds: "{{ pause_after_bridge_domains }}"

    # EPGs - Standard (No Intra-EPG Isolation)
    - name: Create Standard EPGs
      cisco.aci.aci_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ item.epg }}"
        bd: "{{ item.bd }}"
        state: present
      loop: "{{ epgs_standard }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # EPGs - With Intra-EPG Isolation
    - name: Create EPGs with Intra-EPG Isolation
      cisco.aci.aci_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ item.epg }}"
        bd: "{{ item.bd }}"
        intra_epg_isolation: enforced
        state: present
      loop: "{{ epgs_isolated }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause after EPGs
      pause:
        seconds: "{{ pause_after_epgs }}"

    # Bind Physical Domain to EPGs (VLAN 31 and 101)
    - name: Bind Physical Domain to EPGs
      cisco.aci.aci_epg_to_domain:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ item }}"
        domain: "{{ physical_domain }}"
        domain_type: "{{ domain_type }}"
        state: present
      loop: "{{ epgs_with_domain }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Add Subnets to EPGs
    - name: Add Subnet to VLAN 31 EPG
      cisco.aci.aci_epg_subnet:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ epg_vlan31 }}"
        gateway: 192.168.12.1
        mask: 22
        scope: public
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Add Subnet to VLAN 101 EPG
      cisco.aci.aci_epg_subnet:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ epg_vlan101 }}"
        gateway: 10.1.0.1
        mask: 24
        scope: public
        state: present
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Pause before static bindings
      pause:
        seconds: "{{ pause_before_static_bindings }}"

    # Static Port Bindings - VPC
    # Bind all VPC interfaces for standard EPGs
    - name: Bind Standard EPGs to all VPC interfaces
      cisco.aci.aci_static_binding_to_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ item.0.epg }}"
        interface_type: "{{ interface_type_vpc }}"
        pod_id: "{{ pod_id }}"
        leafs: "{{ leaf_pair }}"
        interface: "{{ item.1 }}"
        encap_id: "{{ item.0.vlan }}"
        deploy_immediacy: "{{ deploy_immediacy }}"
        mode: "{{ binding_mode }}"
        state: present
      loop: "{{ vpc_standard_bindings | product(vpc_interfaces) | list }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Static Port Bindings - Individual Ports for VLAN 24
    - name: Bind VLAN 24 EPG to L1101 ports
      cisco.aci.aci_static_binding_to_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ epg_vlan24 }}"
        interface_type: "{{ interface_type_switch_port }}"
        pod_id: "{{ pod_id }}"
        leafs: "{{ leaf_1101 }}"
        interface: "1/{{ item }}"
        encap_id: 24
        deploy_immediacy: "{{ deploy_immediacy }}"
        mode: "{{ binding_mode }}"
        state: present
      loop: "{{ vlan24_ports }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind VLAN 24 EPG to L1102 ports
      cisco.aci.aci_static_binding_to_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ epg_vlan24 }}"
        interface_type: "{{ interface_type_switch_port }}"
        pod_id: "{{ pod_id }}"
        leafs: "{{ leaf_1102 }}"
        interface: "1/{{ item }}"
        encap_id: 24
        deploy_immediacy: "{{ deploy_immediacy }}"
        mode: "{{ binding_mode }}"
        state: present
      loop: "{{ vlan24_ports }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # Private VLAN Bindings
    - name: Bind Private VLAN EPGs to all VPC interfaces
      cisco.aci.aci_static_binding_to_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "{{ item.0.epg }}"
        interface_type: "{{ interface_type_vpc }}"
        pod_id: "{{ pod_id }}"
        leafs: "{{ leaf_pair }}"
        interface: "{{ item.1 }}"
        encap_id: "{{ item.0.secondary_vlan }}"
        primary_encap_id: "{{ item.0.primary_vlan }}"
        deploy_immediacy: "{{ deploy_immediacy }}"
        mode: "{{ binding_mode }}"
        state: present
      loop: "{{ private_vlan_bindings | product(vpc_interfaces) | list }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    # EPGs for VLAN range 1400-2999
    - name: Create EPGs for VLAN range 1400-2999
      cisco.aci.aci_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "ops_vlan_{{ item }}_epg"
        bd: "{{ bd_sons }}"
        state: present
      loop: "{{ range(vlan_range_start, vlan_range_end) | list }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed

    - name: Bind EPGs 1400-2999 to all VPC interfaces
      cisco.aci.aci_static_binding_to_epg:
        host: "{{ ansible_host }}"
        username: "{{ aci_username }}"
        password: "{{ ansible_password }}"
        validate_certs: "{{ validate_certs }}"
        use_ssl: yes
        tenant: "{{ tenant_name }}"
        ap: "{{ app_profile }}"
        epg: "ops_vlan_{{ item.0 }}_epg"
        interface_type: "{{ interface_type_vpc }}"
        pod_id: "{{ pod_id }}"
        leafs: "{{ leaf_pair }}"
        interface: "{{ item.1 }}"
        encap_id: "{{ item.0 }}"
        deploy_immediacy: "{{ deploy_immediacy }}"
        mode: "{{ binding_mode }}"
        state: present
      loop: "{{ range(vlan_range_start, vlan_range_end) | list | product(vpc_interfaces) | list }}"
      throttle: "{{ throttle_large_loops }}"
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      register: result
      until: result is not failed
