---
# ACI Configuration Variables

# Authentication
aci_username: ansible_user

# Retry and Throttle Settings
retry_count: 3
retry_delay: 2
throttle_vlan_pool: 1
throttle_large_loops: 5

# Pause Durations (seconds)
pause_after_ntp: 3
pause_after_policies: 3
pause_after_vlan_pool: 3
pause_after_domain: 3
pause_after_policy_groups: 3
pause_after_interface_selectors: 3
pause_after_switch_profiles: 5
pause_after_bridge_domains: 3
pause_after_epgs: 3
pause_before_static_bindings: 3

# NTP Configuration
ntp_policy_name: ntp_pol
ntp_admin_state: enabled
ntp_server_state: disabled
ntp_auth_state: disabled
ntp_server_ip: 1.1.10.15
ntp_mgmt_epg: default
pod_policy_group_name: pod1_pg

# Interface Policies
cdp_policy_disabled: cdp_disabled
cdp_policy_enabled: cdp-enabled
lldp_policy_enabled: lldp-enabled
lldp_policy_disabled: lldp-disabled
stp_policy: bpdu_filter_enabled
storm_control_policy: bum10_drop
link_level_policy: 25G-auto
port_channel_mode_off: mode-off
port_channel_lacp_active: lacp_active
# Port Channel Policy (only for VPC)
port_channel_static_on: static-on


# Storm Control Configuration
storm_control_action: drop
storm_control_rate_type: percentage
storm_control_rate: 10
storm_control_burst_rate: 10

# MCP Configuration
mcp_policy_name: mcp_policy
mcp_admin_state: true
mode: non_strict

# Link Level Configuration
link_speed: 25G
auto_negotiation: yes

# Role: leaf or spine (Manage Fabric Node Members)
