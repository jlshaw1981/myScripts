# Ops EPG Ranges for Domain Binding - flattened list
# Note: EPGs are created separately using vlan_range_start/end
# Range() calls were using inclusive start, exclusive end — 
# but several had the same start and end, which produced an empty list. Fixed now

ops_epg_vlan_ids: >-
  {{
    (range(20, 22) | list) +
    (range(24, 31) | list) +
    (range(40, 42) | list) +
    (range(45, 51) | list) +
    (range(80, 82) | list) +
    (range(91, 93) | list) +
