  - ops_vlan22_epg
  - ops_vlan91_epg
  - ops_vlan101_epg

# EPG Ranges for Domain Binding - flattened list
# Note: Range 1400-2999 EPGs are created separately using vlan_range_start/end
# All ranges below need domain binding after EPGs are created
epg_vlan_ids: >-
  {{
    (range(24, 32) | list) +
    (range(70, 73) | list) +
    (range(80, 83) | list) +
    (range(1400, 3000) | list)
  }}

# Subnet Configurations
subnets:
  - { epg: ops_vlan31_epg, gateway: 192.168.12.1, mask: 22 }
  - { epg: ops_vlan101_epg, gateway: 10.1.0.1, mask: 24 }

