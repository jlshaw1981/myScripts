---
# =====================================================
# Dynamic ACI L3Out Deployment Playbook
#
# The user fills out dynamic_l3out_vars.yml (the "form")
# and this playbook builds the L3Out. Every section of
# the vars file that is left out is silently skipped.
#
# Supports:
#   - Protocols: bgp, ospf, eigrp, static, pim (any mix)
#   - Interface types: l3-port, sub-interface, ext-svi
#   - vPC SVIs with side A/B member addresses
#   - Interface-level AND node-level (loopback) BGP peers
#     with full peer options (controls, ttl, weight, etc.)
#   - OSPF area + per-interface-profile OSPF policy w/ auth
#   - EIGRP ASN
#   - Static routes with preferences and next hops
#   - Node loopbacks
#   - External EPGs: subnets (all scopes, aggregate),
#     preferred group, contract bindings
#
# Enforcement:
#   - tenant and vrf names are FORCED to lowercase before
#     any object is created
#
# Requires:
#   cisco.aci collection >= 2.3.0
#
# Run:
#   ansible-playbook dynamic_l3out_playbook.yml --ask-vault-pass
# =====================================================

- name: Deploy dynamic ACI L3Out
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - dynamic_l3out_vars.yml
    # - vault.yml   # uncomment if vault_apic_password lives in a separate vault file

  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: "{{ validate_certs }}"

    # Normalize l3protocol to a lowercase list (string or list input)
    l3protocols: "{{ [l3out.l3protocol] | flatten | map('lower') | list }}"

    # Flatten node_profiles -> interface_profiles -> interfaces
    l3out_interfaces: >-
      {%- set result = [] -%}
      {%- for np in node_profiles -%}
        {%- for ip in np.interface_profiles | default([]) -%}
          {%- for intf in ip.interfaces | default([]) -%}
            {%- set _ = result.append(intf | combine({
                  'node_profile': np.name,
                  'interface_profile': ip.name })) -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}

    # Flatten interfaces -> bgp_peers (interface-level BGP peers)
    intf_bgp_peer_list: >-
      {%- set result = [] -%}
      {%- for np in node_profiles -%}
        {%- for ip in np.interface_profiles | default([]) -%}
          {%- for intf in ip.interfaces | default([]) -%}
            {%- for peer in intf.bgp_peers | default([]) -%}
              {%- set _ = result.append(peer | combine({
                    'node_profile': np.name,
                    'interface_profile': ip.name,
                    'pod_id': intf.pod_id,
                    'node_id': intf.node_id,
                    'path': intf.path })) -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}

    # Flatten nodes -> bgp_peers (node-level / loopback BGP peers)
    node_bgp_peer_list: >-
      {%- set result = [] -%}
      {%- for np in node_profiles -%}
        {%- for node in np.nodes | default([]) -%}
          {%- for peer in node.bgp_peers | default([]) -%}
            {%- set _ = result.append(peer | combine({
                  'node_profile': np.name,
                  'pod_id': node.pod_id,
                  'node_id': node.node_id })) -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}

    # Flatten interfaces -> vpc_members (side A/B addresses for vPC SVIs)
    vpc_member_list: >-
      {%- set result = [] -%}
      {%- for np in node_profiles -%}
        {%- for ip in np.interface_profiles | default([]) -%}
          {%- for intf in ip.interfaces | default([]) -%}
            {%- for member in intf.vpc_members | default([]) -%}
              {%- set _ = result.append(member | combine({
                    'node_profile': np.name,
                    'interface_profile': ip.name,
                    'pod_id': intf.pod_id,
                    'node_id': intf.node_id,
                    'path': intf.path })) -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}

    # Flatten node_profiles -> nodes -> static_routes
    static_route_list: >-
      {%- set result = [] -%}
      {%- for np in node_profiles -%}
        {%- for node in np.nodes | default([]) -%}
          {%- for route in node.static_routes | default([]) -%}
            {%- set _ = result.append(route | combine({
                  'node_profile': np.name,
                  'pod_id': node.pod_id,
                  'node_id': node.node_id })) -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}

    # Flatten static_routes -> next_hops
    static_route_nexthop_list: >-
      {%- set result = [] -%}
      {%- for np in node_profiles -%}
        {%- for node in np.nodes | default([]) -%}
          {%- for route in node.static_routes | default([]) -%}
            {%- for nh in route.next_hops | default([]) -%}
              {%- set _ = result.append({
                    'node_profile': np.name,
                    'pod_id': node.pod_id,
                    'node_id': node.node_id,
                    'prefix': route.prefix,
                    'nexthop': nh.address | default(nh),
                    'nh_preference': (nh.preference | default(None)) if nh is mapping else None }) -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}

    # Flatten external_epgs -> contracts
    extepg_contract_list: >-
      {%- set result = [] -%}
      {%- for epg in external_epgs | default([]) -%}
        {%- for contract in epg.contracts | default([]) -%}
          {%- set _ = result.append(contract | combine({'extepg': epg.name})) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}

  tasks:

    # -------------------------------------------------
    # Input validation and lowercase enforcement
    # -------------------------------------------------
    - name: Validate required variables are defined
      ansible.builtin.assert:
        that:
          - tenant is defined and tenant | length > 0
          - vrf is defined and vrf | length > 0
          - l3out is defined
          - l3out.name is defined
          - l3out.domain is defined
          - node_profiles is defined
        fail_msg: >-
          Missing required variables: tenant, vrf, l3out (name/domain),
          and node_profiles must all be defined in the vars file.

    - name: Validate EIGRP has an ASN
      ansible.builtin.assert:
        that:
          - l3out.asn is defined
        fail_msg: "l3out.asn is required when l3protocol includes eigrp."
      when: "'eigrp' in l3protocols"

    - name: Validate OSPF has area settings
      ansible.builtin.assert:
        that:
          - l3out.ospf is defined
          - l3out.ospf.area_id is defined
        fail_msg: "l3out.ospf.area_id is required when l3protocol includes ospf."
      when: "'ospf' in l3protocols"

    - name: Force tenant and VRF names to lowercase
      ansible.builtin.set_fact:
        tenant_original: "{{ tenant }}"
        vrf_original: "{{ vrf }}"
        tenant: "{{ tenant | lower }}"
        vrf: "{{ vrf | lower }}"

    - name: Notify when names were normalized
      ansible.builtin.debug:
        msg: >-
          Name(s) normalized to lowercase:
          tenant '{{ tenant_original }}' -> '{{ tenant }}',
          vrf '{{ vrf_original }}' -> '{{ vrf }}'
      when: tenant_original != tenant or vrf_original != vrf

    # -------------------------------------------------
    # Tenant and VRF
    # -------------------------------------------------
    - name: Create tenant {{ tenant }}
      cisco.aci.aci_tenant:
        <<: *aci_login
        tenant: "{{ tenant }}"
        description: "{{ tenant_description | default(omit) }}"
        state: present

    - name: Create VRF {{ vrf }}
      cisco.aci.aci_vrf:
        <<: *aci_login
        tenant: "{{ tenant }}"
        vrf: "{{ vrf }}"
        description: "{{ vrf_description | default(omit) }}"
        policy_control_preference: "{{ vrf_policy_control | default(omit) }}"
        policy_control_direction: "{{ vrf_policy_direction | default(omit) }}"
        state: present

    # -------------------------------------------------
    # L3Out
    # -------------------------------------------------
    - name: Create L3Out {{ l3out.name }}
      cisco.aci.aci_l3out:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        description: "{{ l3out.description | default(omit) }}"
        vrf: "{{ vrf }}"
        domain: "{{ l3out.domain }}"
        route_control: "{{ l3out.route_control | default(omit) }}"
        l3protocol: "{{ l3protocols }}"
        asn: "{{ l3out.asn | default(omit) }}"          # eigrp only
        state: present

    # -------------------------------------------------
    # OSPF area (only when ospf is in l3protocol)
    # -------------------------------------------------
    - name: Configure OSPF area on L3Out
      cisco.aci.aci_rest:
        <<: *aci_login
        path: "/api/mo/uni/tn-{{ tenant }}/out-{{ l3out.name }}/ospfExtP.json"
        method: post
        content:
          ospfExtP:
            attributes:
              areaId: "{{ l3out.ospf.area_id }}"
              areaType: "{{ l3out.ospf.area_type | default('regular') }}"
              areaCost: "{{ l3out.ospf.area_cost | default('1') }}"
              areaCtrl: "{{ l3out.ospf.area_ctrl | default('redistribute,summary') }}"
      when: "'ospf' in l3protocols"

    # -------------------------------------------------
    # Logical node profiles and nodes
    # -------------------------------------------------
    - name: Create logical node profiles
      cisco.aci.aci_l3out_logical_node_profile:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        node_profile: "{{ item.name }}"
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ node_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Configure nodes with router IDs and optional loopbacks
      cisco.aci.aci_l3out_logical_node:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        node_profile: "{{ item.0.name }}"
        pod_id: "{{ item.1.pod_id }}"
        node_id: "{{ item.1.node_id }}"
        router_id: "{{ item.1.router_id }}"
        loopback_address: "{{ item.1.loopback_address | default(omit) }}"
        state: present
      loop: "{{ node_profiles | subelements('nodes') }}"
      loop_control:
        label: "{{ item.0.name }} -> node-{{ item.1.node_id }} (rtr-id {{ item.1.router_id }}, lo {{ item.1.loopback_address | default('none') }})"

    # -------------------------------------------------
    # Static routes and next hops (only when defined)
    # -------------------------------------------------
    - name: Configure static routes
      cisco.aci.aci_l3out_static_routes:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        logical_node: "{{ item.node_profile }}"
        pod_id: "{{ item.pod_id }}"
        node_id: "{{ item.node_id }}"
        prefix: "{{ item.prefix }}"
        preference: "{{ item.preference | default(omit) }}"
        state: present
      loop: "{{ static_route_list }}"
      loop_control:
        label: "{{ item.node_profile }} node-{{ item.node_id }} -> {{ item.prefix }}"
      when: static_route_list | length > 0

    - name: Configure static route next hops
      cisco.aci.aci_l3out_static_routes_nexthop:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        logical_node: "{{ item.node_profile }}"
        pod_id: "{{ item.pod_id }}"
        node_id: "{{ item.node_id }}"
        prefix: "{{ item.prefix }}"
        nexthop: "{{ item.nexthop }}"
        state: present
      loop: "{{ static_route_nexthop_list }}"
      loop_control:
        label: "{{ item.prefix }} -> via {{ item.nexthop }}"
      when: static_route_nexthop_list | length > 0

    # -------------------------------------------------
    # Logical interface profiles and interfaces
    # -------------------------------------------------
    - name: Create logical interface profiles
      cisco.aci.aci_l3out_logical_interface_profile:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        node_profile: "{{ item.0.name }}"
        interface_profile: "{{ item.1.name }}"
        description: "{{ item.1.description | default(omit) }}"
        state: present
      loop: "{{ node_profiles | subelements('interface_profiles', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1.name }}"

    - name: Configure L3Out interfaces (routed / sub-interface / SVI)
      cisco.aci.aci_l3out_interface:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        node_profile: "{{ item.node_profile }}"
        interface_profile: "{{ item.interface_profile }}"
        pod_id: "{{ item.pod_id }}"
        node_id: "{{ item.node_id }}"
        path_ep: "{{ item.path }}"
        interface_type: "{{ item.interface_type }}"
        encap: "{{ item.encap | default(omit) }}"            # omit for l3-port
        encap_scope: "{{ item.encap_scope | default(omit) }}"
        address: "{{ item.address | default(omit) }}"        # omit for vPC (use vpc_members)
        mtu: "{{ item.mtu | default(omit) }}"
        mode: "{{ item.mode | default(omit) }}"              # e.g. regular for SVI trunk
        auto_state: "{{ item.auto_state | default(omit) }}"  # SVI only
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ l3out_interfaces }}"
      loop_control:
        label: "{{ item.node_profile }}/{{ item.interface_profile }} node-{{ item.node_id }} {{ item.path }} {{ item.interface_type }} {{ item.encap | default('no-encap') }} {{ item.address | default('vpc-member-addressed') }}"

    # -------------------------------------------------
    # vPC SVI member addresses (only when defined)
    # -------------------------------------------------
    - name: Configure vPC member side A/B addresses
      cisco.aci.aci_l3out_logical_interface_vpc_member:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        node_profile: "{{ item.node_profile }}"
        interface_profile: "{{ item.interface_profile }}"
        pod_id: "{{ item.pod_id }}"
        node_id: "{{ item.node_id }}"
        path_ep: "{{ item.path }}"
        side: "{{ item.side }}"
        address: "{{ item.address }}"
        ipv6_dad: "{{ item.ipv6_dad | default(omit) }}"
        state: present
      loop: "{{ vpc_member_list }}"
      loop_control:
        label: "{{ item.node_profile }}/{{ item.interface_profile }} {{ item.path }} side-{{ item.side }} {{ item.address }}"
      when: vpc_member_list | length > 0

    # -------------------------------------------------
    # OSPF interface policy (only when defined)
    # -------------------------------------------------
    - name: Attach OSPF interface policy to interface profiles
      cisco.aci.aci_l3out_logical_interface_profile_ospf_policy:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        node_profile: "{{ item.0.name }}"
        interface_profile: "{{ item.1.name }}"
        ospf_policy: "{{ item.1.ospf_policy }}"
        ospf_auth_type: "{{ item.1.ospf_auth_type | default(omit) }}"
        ospf_auth_key: "{{ item.1.ospf_auth_key | default(omit) }}"
        ospf_auth_key_id: "{{ item.1.ospf_auth_key_id | default(omit) }}"
        state: present
      loop: "{{ node_profiles | subelements('interface_profiles', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1.name }} -> {{ item.1.ospf_policy | default('none') }}"
      when:
        - "'ospf' in l3protocols"
        - item.1.ospf_policy is defined

    # -------------------------------------------------
    # BGP peers - interface level (only when defined)
    # -------------------------------------------------
    - name: Configure interface-level BGP peers
      cisco.aci.aci_l3out_bgp_peer:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        node_profile: "{{ item.node_profile }}"
        interface_profile: "{{ item.interface_profile }}"
        pod_id: "{{ item.pod_id }}"
        node_id: "{{ item.node_id }}"
        path_ep: "{{ item.path }}"
        peer_ip: "{{ item.peer_ip }}"
        remote_asn: "{{ item.remote_asn }}"
        local_as_number: "{{ item.local_asn | default(omit) }}"
        local_as_number_config: "{{ item.local_asn_config | default(omit) }}"
        admin_state: "{{ item.admin_state | default('enabled') }}"
        bgp_controls: "{{ item.bgp_controls | default(omit) }}"
        peer_controls: "{{ item.peer_controls | default(omit) }}"
        address_type_controls: "{{ item.address_type_controls | default(omit) }}"
        private_asn_controls: "{{ item.private_asn_controls | default(omit) }}"
        ttl: "{{ item.ttl | default(omit) }}"
        weight: "{{ item.weight | default(omit) }}"
        allow_self_as_count: "{{ item.allow_self_as_count | default(omit) }}"
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ intf_bgp_peer_list }}"
      loop_control:
        label: "{{ item.node_profile }}/{{ item.interface_profile }} node-{{ item.node_id }} {{ item.path }} -> peer {{ item.peer_ip }} (AS {{ item.remote_asn }})"
      when:
        - "'bgp' in l3protocols"
        - intf_bgp_peer_list | length > 0

    # -------------------------------------------------
    # BGP peers - node level / loopback (only when defined)
    # -------------------------------------------------
    - name: Configure node-level (loopback) BGP peers
      cisco.aci.aci_l3out_bgp_peer:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        node_profile: "{{ item.node_profile }}"
        pod_id: "{{ item.pod_id }}"
        node_id: "{{ item.node_id }}"
        peer_ip: "{{ item.peer_ip }}"
        remote_asn: "{{ item.remote_asn }}"
        local_as_number: "{{ item.local_asn | default(omit) }}"
        local_as_number_config: "{{ item.local_asn_config | default(omit) }}"
        admin_state: "{{ item.admin_state | default('enabled') }}"
        bgp_controls: "{{ item.bgp_controls | default(omit) }}"
        peer_controls: "{{ item.peer_controls | default(omit) }}"
        address_type_controls: "{{ item.address_type_controls | default(omit) }}"
        private_asn_controls: "{{ item.private_asn_controls | default(omit) }}"
        ttl: "{{ item.ttl | default(omit) }}"
        weight: "{{ item.weight | default(omit) }}"
        allow_self_as_count: "{{ item.allow_self_as_count | default(omit) }}"
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ node_bgp_peer_list }}"
      loop_control:
        label: "{{ item.node_profile }} node-{{ item.node_id }} -> peer {{ item.peer_ip }} (AS {{ item.remote_asn }})"
      when:
        - "'bgp' in l3protocols"
        - node_bgp_peer_list | length > 0

    # -------------------------------------------------
    # External EPGs, subnets, and contracts (only when defined)
    # -------------------------------------------------
    - name: Create external EPGs
      cisco.aci.aci_l3out_extepg:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        extepg: "{{ item.name }}"
        description: "{{ item.description | default(omit) }}"
        preferred_group: "{{ item.preferred_group | default(omit) }}"
        state: present
      loop: "{{ external_epgs | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create external EPG subnets
      cisco.aci.aci_l3out_extsubnet:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        extepg: "{{ item.0.name }}"
        network: "{{ item.1.subnet }}"
        subnet_name: "{{ item.1.subnet_name | default(omit) }}"
        scope: "{{ item.1.scope | default(omit) }}"
        aggregate: "{{ item.1.aggregate | default(omit) }}"
        state: present
      loop: "{{ external_epgs | default([]) | subelements('subnets', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }} -> {{ item.1.subnet }} ({{ item.1.scope | default('import-security') }})"

    - name: Bind contracts to external EPGs
      cisco.aci.aci_l3out_extepg_to_contract:
        <<: *aci_login
        tenant: "{{ tenant }}"
        l3out: "{{ l3out.name }}"
        extepg: "{{ item.extepg }}"
        contract: "{{ item.name }}"
        contract_type: "{{ item.type }}"
        state: present
      loop: "{{ extepg_contract_list }}"
      loop_control:
        label: "{{ item.extepg }} -> {{ item.type }} {{ item.name }}"
      when: extepg_contract_list | length > 0
